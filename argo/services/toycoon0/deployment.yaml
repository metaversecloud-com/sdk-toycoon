apiVersion: apps/v1
kind: Deployment
metadata:
  name: toycoon0
  labels:
    app.kubernetes.io/name: toycoon0
spec:
  # Replicas managed by the per-env KEDA HTTPScaledObject (dev scale-to-zero).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: toycoon0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toycoon0
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: toycoon0
          image: toycoon0 # placeholder; overlay images: maps it
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: toycoon0-config
            - secretRef:
                name: toycoon0-secrets
          livenessProbe:
            httpGet:
              path: /api/system/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/system/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
